name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v6
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: pnpm
      
      - name: Install
        run: make install
      
      - name: Run linter
        run: make lint
      
      - name: Run tests
        run: make test